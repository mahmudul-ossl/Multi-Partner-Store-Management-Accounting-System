# Local stack. A fresh clone needs only `docker compose up -d`.
# No host .env, Composer, npm, key:generate, or migrate.

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  image: mpstore-app
  restart: unless-stopped
  volumes:
    - app_storage:/var/www/html/storage
    - bootstrap_state:/var/www/secrets
  networks:
    - mpstore

x-app-environment: &app-environment
  APP_NAME: "MP Store"
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: "${APP_URL:-http://localhost:8000}"
  APP_TIMEZONE: Asia/Dhaka
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_CURRENCY: BDT
  APP_CURRENCY_SYMBOL: "৳"
  APP_DATE_FORMAT: d-M-Y
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-mpstore}"
  DB_USERNAME: "${DB_USERNAME:-mpstore}"
  DB_PASSWORD: "${DB_PASSWORD:-mpstore}"
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SESSION_SECURE_COOKIE: "false"
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: hello@mpstore.test
  MAIL_FROM_NAME: "MP Store"
  SEED_SUPER_ADMIN_NAME: "System Administrator"
  SEED_SUPER_ADMIN_EMAIL: "${SEED_SUPER_ADMIN_EMAIL:-superadmin@mpstore.test}"
  SEED_SUPER_ADMIN_PASSWORD: "${SEED_SUPER_ADMIN_PASSWORD:-SuperAdmin#2026}"
  SEED_DEMO_PASSWORD: "${SEED_DEMO_PASSWORD:-Partner#2026}"
  SEED_ON_BOOT: "true"

services:
  app:
    <<: *app-service
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: mpstore-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mpstore

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-mpstore}"
      MYSQL_USER: "${DB_USERNAME:-mpstore}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-mpstore}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
      - --skip-symbolic-links
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - mpstore

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mpstore

  queue:
    <<: *app-service
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:default", "--max=1000"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - mpstore

  scheduler:
    <<: *app-service
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - mpstore

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: "${DB_USERNAME:-mpstore}"
      PMA_PASSWORD: "${DB_PASSWORD:-mpstore}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mpstore

networks:
  mpstore:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_storage:
  bootstrap_state:
